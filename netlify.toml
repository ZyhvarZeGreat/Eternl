# Netlify deploy (eternl-wallet.xyz). Vercel ignores this file.
# Path preserved: /about → https://www.eternl-wallet.xyz/about
#
# Do NOT use `from = "/*"` → https://www.eternl-wallet.xyz — that applies to the primary
# hostname too and causes ERR_TOO_MANY_REDIRECTS. Scope rules to alias hosts only.

[[redirects]]
  from = "https://eternl-wallet.xyz/*"
  to = "https://www.eternl-wallet.xyz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://eternl-wallet.xyz/*"
  to = "https://www.eternl-wallet.xyz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.eternl-wallet.xyz/*"
  to = "https://www.eternl-wallet.xyz/:splat"
  status = 301
  force = true
